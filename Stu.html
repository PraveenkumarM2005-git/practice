<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration Form</title>
    </head>
    <body>

        <h2>Student Registration Form</h2>

        <h3>Personal Information</h3>

        <form>
            Full Name:
            <input type="text" placeholder="Enter your full name"><br><br>

            Email:
            <input type="email" placeholder="Enter your email"><br><br>

            Phone Number:
            <input type="text" placeholder="Enter your phone number"><br><br>

            Date of Birth:
            <input type="date"><br><br>

            Gender:<br>
            <input type="radio" name="gender"> Male<br>
            <input type="radio" name="gender"> Female<br>
            <input type="radio" name="gender"> Other<br><br>

            Address:<br>
            <textarea rows="4" cols="30"
                placeholder="Enter your address"></textarea><br><br>

            <h3>Academic Information</h3>

            Highest Qualification:
            <select>
                <option>SSLC</option>
                <option>HSC</option>
                <option>Diploma</option>
                <option>UG</option>
                <option>PG</option>
            </select><br><br>

            Courses Interested In:<br>
            <input type="checkbox"> HTML<br>
            <input type="checkbox"> CSS<br>
            <input type="checkbox"> JavaScript<br>
            <input type="checkbox"> Python<br><br>

            Upload Resume:
            <input type="file"><br><br>

            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </form>

    </body>
</html>
