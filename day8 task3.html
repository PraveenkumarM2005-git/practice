<!DOCTYPE html>
<html>
    <head>
        <title>Greeting Page</title>
        <style>
        body {
            background: #f1f7fb;
            font-family: Arial;
        }
        .box {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .msg {
            margin-top: 15px;
            color: green;
            font-weight: bold;
        }
    </style>
    </head>
    <body>

        <div class="box">
            <h2>Welcome to My Website</h2>
            <p>Enter your name below and click the button to see a greeting:</p>
            <input type="text" id="uname" placeholder="Enter your name">
            <button onclick="greet()">Greet Me</button>
            <div class="msg" id="message"></div>
        </div>

        <script>
    function greet() {
        var n = document.getElementById("uname").value;
        document.getElementById("message").innerHTML = "Hello, " + n + "! Welcome to this website 😊";
    }
</script>

    </body>
</html>
